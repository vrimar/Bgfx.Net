name: ci-pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed:
    name: Build and test managed code
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Sync bindings and regenerate
        run: |
          bash build/sync-bindings.sh
          bash build/run-generator.sh

      - name: Verify generated files and bgfx pin are in sync with submodule
        run: |
          paths='src/Bgfx.Net/Generated/bgfx.g.cs src/Bgfx.Net/Generated/bgfx.raw.cs src/Bgfx.Net/Generated/BgfxBuildInfo.g.cs src/Bgfx.Net/AssemblyInfo.cs'
          if ! git diff --exit-code -- $paths; then
            echo "::error::Generated bindings or bgfx pin out of sync with submodule. Run sync-bindings.sh + run-generator.sh locally and commit."
            git --no-pager diff -- $paths | head -100
            exit 1
          fi

      - name: Verify 3rd-party license inventory is in sync with submodules
        run: bash build/audit-3rdparty-licenses.sh --check

      - name: Build solution
        run: dotnet build Bgfx.Net.sln -c Release -p:SkipNativeWarning=true

      - name: Run generator tests
        run: dotnet test tests/Bgfx.Net.Generator.Tests/Bgfx.Net.Generator.Tests.csproj -c Release --no-build

      - name: Run smoke tests (no native lib loaded)
        run: dotnet test tests/Bgfx.Net.Tests/Bgfx.Net.Tests.csproj -c Release --no-build
